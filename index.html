<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代化網頁範本</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">我的網頁</div>
        <ul class="nav-links">
            <li><a href="#home">首頁</a></li>
            <li><a href="#about">關於</a></li>
            <li><a href="#contact">聯絡我們</a></li>
        </ul>
    </nav>
    <main>
        <section id="home">
            <h1>歡迎來到我的網頁</h1>
            <p>這是一個簡單、現代化的網頁範本。</p>
        </section>
        <section id="about">
            <h2>關於本站</h2>
            <p>這裡可以放置你的介紹、作品或其他資訊。</p>
        </section>
        <section id="contact">
            <h2>聯絡我們</h2>
            <form>
                <input type="text" placeholder="您的姓名" required>
                <input type="email" placeholder="電子郵件" required>
                <textarea placeholder="留言內容" required></textarea>
                <button type="submit">送出</button>
            </form>
        </section>
    </main>
</body>
</html>
